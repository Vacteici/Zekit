<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Maintenance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5f5;
            margin-bottom: 20px;
        }

        .status {
            color: #FFC300;
            font-weight: bold;
        }

        .loader {
            margin: 20px auto;
            border: 5px solid #1e293b;
            border-top: 5px solid #FFC300;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚧 Site en maintenance</h1>
        <p>On améliore le site pour vous offrir une meilleure expérience.</p>
        <p class="status">Retour très bientôt !</p>

        <div class="loader"></div>

        <footer>
            © 2026 - Merci de votre patience
        </footer>
    </div>

</body>
</html>
